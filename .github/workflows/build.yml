# Builds the OpenWrt packages. Publishing is release.yml, which calls this workflow.
---
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Called by release.yml. Inside a called workflow github.ref and
  # github.event_name are the CALLER's, which the conditions below rely on.
  workflow_call:
    inputs:
      full:
        description: Build everything, because the caller is publishing it
        type: boolean
        default: false
    outputs:
      ipk_sdk:
        description: SDK tag the 24.10 packages were built with
        value: ${{ jobs.arches.outputs.ipk_sdk }}
      apk_sdk:
        description: SDK tag the 25.12 packages were built with
        value: ${{ jobs.arches.outputs.apk_sdk }}

permissions:
  contents: read

# github.workflow is the caller's name inside a called workflow: without it, a standalone Build
# and the one Release calls share a group on a push to main and cancel each other.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GO_VERSION: "1.26.x"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
      packages: ${{ steps.decide.outputs.packages }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide what needs building
        id: decide
        # Through the environment, not expanded into the script: a fork names
        # its own branch, and a name holding $(...) would otherwise run here.
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "${{ inputs.full }}" = "true" ] ||
             [ "${{ github.event_name }}" = "workflow_dispatch" ] ||
             [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "release, tag or manual run: building everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "packages=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The Release run on this same push builds and publishes this version; building here would duplicate it.
          if [ "${{ github.event_name }}" = "push" ] &&
             [ "${{ github.ref }}" = "refs/heads/main" ]; then
            v=$(sed -n 's/^PKG_VERSION:=[[:space:]]*//p' qwdtt-client/Makefile |
                tr -d '[:space:]')
            if [ -n "$v" ] && ! git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
              echo "v$v is unreleased; the Release run on this push builds it"
              echo "code=false" >> "$GITHUB_OUTPUT"
              echo "packages=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          # A new branch reports an all-zero before, and a force-push can name
          # a commit that no longer exists. Neither is a diff we can trust.
          for commit in "$base" "$head"; do
            if [ -z "$commit" ] ||
               [ "$commit" = "0000000000000000000000000000000000000000" ] ||
               ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
              echo "no usable commit '$commit': building everything"
              echo "code=true" >> "$GITHUB_OUTPUT"
              echo "packages=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Three dots: what the branch added, not what main did meanwhile.
            changed=$(git diff --name-only "$base...$head")
          else
            changed=$(git diff --name-only "$base" "$head")
          fi
          echo "changed files:"; echo "$changed" | sed 's/^/  /'

          # A version-only bump is rebuilt by the release its merge starts. Decided by the diff,
          # not the branch name, so nothing else can ride on the name.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            case "$HEAD_REF" in
            release/v*)
              # || true: grep -c exits 1 on a zero count, and the step runs under bash -e.
              others=$(echo "$changed" |
                grep -vE '^(qwdtt-client|luci-proto-qwdtt)/Makefile$' | grep -c . || true)
              if [ "$others" = 0 ]; then
                echo "version bump only; the release after the merge builds it"
                echo "code=false" >> "$GITHUB_OUTPUT"
                echo "packages=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "release branch carries $others file(s) beyond the version; building" ;;
            esac
          fi
          if echo "$changed" |
             grep -qE '^client/|^\.github/(workflows|scripts)/|^build\.sh$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # Wider than the package directories: the feed scripts, target map and installer
          # are otherwise only exercised by a release.
          if echo "$changed" |
             grep -qE '^(luci-proto-qwdtt|qwdtt-client|assets|keys)/|^\.github/(workflows|scripts)/|^\.github/openwrt-targets\.json$|^(install|build)\.sh$'; then
            echo "packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "packages=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: check
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: client/go.sum

      # Meaningful only because .gitattributes checks the tree out with LF: on
      # a CRLF checkout gofmt reports every file and the gate says nothing.
      - name: gofmt
        working-directory: client
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      # -tags=openwrt on both: without it the wrong raw-socket implementation
      # is selected, so an untagged run checks code the release never builds.
      - name: vet
        working-directory: client
        run: go vet -tags=openwrt ./...

      # -short skips the live DoH test against login.vk.ru, so the gate does not depend on VK.
      - name: test
        working-directory: client
        run: go test -tags=openwrt -short ./...

      - name: netifd protocol handler
        run: sh qwdtt-client/tests/proto.sh

      - name: config conversion
        run: sh qwdtt-client/tests/migrate.sh

      - name: LuCI translations
        run: node luci-proto-qwdtt/tests/po.js

      - name: LuCI routing options
        run: node luci-proto-qwdtt/tests/options.js

      - name: LuCI status backend
        run: node luci-proto-qwdtt/tests/runtime.js

  packages:
    name: packages ${{ matrix.arch }}
    needs: [changes, check, arches]
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # One entry per package format (24.10 builds .ipk, 25.12 .apk); both packages are PKGARCH:=all.
        arch: ${{ fromJSON(needs.arches.outputs.noarch) }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: client/go.sum

      # luci-proto-qwdtt depends on qwdtt-client, so the SDK builds that here
      # too and needs its binary staged. Both SDKs in this matrix are x86_64.
      - name: Cross-compile and stage the client
        working-directory: client
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -tags=openwrt -trimpath -ldflags="-s -w" -o ../qwdtt-client/files/qwdtt-client .

      - name: Build with the OpenWrt SDK
        # Pinned, not @main: the entrypoint decides how the feed is wired and what is built.
        # build.sh pins the same tag.
        uses: openwrt/gh-action-sdk@v11
        env:
          CONTAINER: ghcr.io/openwrt/sdk
          ARCH: ${{ matrix.arch }}
          FEEDNAME: qwdtt
          # Package directories only: luci-i18n-qwdtt-ru is generated by luci.mk from po/, so naming it
          # fails with "No rule to make target". qwdtt-client is built anyway as a dependency.
          PACKAGES: luci-proto-qwdtt

      - name: Show what was produced
        run: |
          # The parentheses matter: -o binds looser than the implicit AND, so -print would apply to *.apk only.
          find bin -type f \( -name '*.ipk' -o -name '*.apk' \) -print | sort
          for want in luci-proto-qwdtt luci-i18n-qwdtt-ru; do
            n=$(find bin/packages -type f \
                  \( -name "$want*.ipk" -o -name "$want*.apk" \) | wc -l)
            echo "$want: $n"
            test "$n" -gt 0 || { echo "$want was not produced"; exit 1; }
          done

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.arch }}
          # Only our own: the SDK also builds ~100 dependency packages into bin/.
          path: |
            bin/packages/*/qwdtt/*.ipk
            bin/packages/*/qwdtt/*.apk
            !bin/packages/*/qwdtt/qwdtt-client*
          if-no-files-found: error
          # A re-run uploads the same names again; without this it fails with a 409.
          overwrite: true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.arch }}
          path: logs/
          if-no-files-found: ignore
          overwrite: true

  # Discovered from downloads.openwrt.org rather than listed here, so an
  # architecture OpenWrt adds is built without an edit.
  arches:
    name: arches
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      noarch: ${{ steps.discover.outputs.noarch }}
      ipk_sdk: ${{ steps.discover.outputs.ipk_sdk }}
      apk_sdk: ${{ steps.discover.outputs.apk_sdk }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Discover the package architectures
        id: discover
        run: |
          set -eu
          set -o pipefail
          map=.github/openwrt-targets.json
          ipk=$(jq -r '."24.10".version' "$map")
          apk=$(jq -r '."25.12".version' "$map")
          echo "releases: $ipk (opkg), $apk (apk)"

          list=$(.github/scripts/openwrt-arches.sh "$ipk" "$apk")
          printf '%s\n' "$list"

          {
            printf 'matrix=%s\n' "$(printf '%s\n' "$list" | jq -cs .)"
            # The arch-independent packages build once per format, on x86_64.
            printf 'noarch=%s\n' "$(printf '[\"x86_64-%s\",\"x86_64-%s\"]' "$ipk" "$apk")"
            printf 'ipk_sdk=x86_64-%s\n' "$ipk"
            printf 'apk_sdk=x86_64-%s\n' "$apk"
          } >> "$GITHUB_OUTPUT"

  client-packages:
    name: client package ${{ matrix.sdk }}
    needs: [check, arches]
    # A release from a merge is a push to main, so only the caller's full input says it is publishing.
    # Dispatch too, to prove packaging on every architecture without spending a version.
    if: >-
      inputs.full ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.arches.outputs.matrix) }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: client/go.sum

      - name: Cross-compile and stage the client
        working-directory: client
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          # 64-bit MIPS reads this one; GOMIPS is ignored there.
          GOMIPS64: ${{ matrix.gomips64 }}
        run: go build -tags=openwrt -trimpath -ldflags="-s -w" -o ../qwdtt-client/files/qwdtt-client .

      - name: Build with the OpenWrt SDK
        uses: openwrt/gh-action-sdk@v11
        env:
          CONTAINER: ghcr.io/openwrt/sdk
          ARCH: ${{ matrix.sdk }}
          FEEDNAME: qwdtt
          PACKAGES: qwdtt-client

      - name: Show what was produced
        run: |
          find bin -type f \
            \( -name 'qwdtt-client*.ipk' -o -name 'qwdtt-client*.apk' \) -print | sort
          n=$(find bin/packages -type f \
                \( -name 'qwdtt-client*.ipk' -o -name 'qwdtt-client*.apk' \) | wc -l)
          test "$n" -gt 0 || { echo "qwdtt-client was not produced"; exit 1; }

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: client-package-${{ matrix.sdk }}
          path: |
            bin/packages/*/qwdtt/qwdtt-client*.ipk
            bin/packages/*/qwdtt/qwdtt-client*.apk
          if-no-files-found: error
          overwrite: true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-client-${{ matrix.sdk }}
          path: logs/
          if-no-files-found: ignore
          overwrite: true
