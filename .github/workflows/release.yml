# Publishes the GitHub release and the signed feed on Pages; building is build.yml's.
# Runs on the merge of a version bump and creates the tag last, so a failed release leaves no tag.
---
name: Release

on:
  push:
    branches: [main]
    # Still accepted, for re-releasing a commit whose tag already exists.
    tags: ['v*']
  # Dispatch reaches the feed without spending a version.
  workflow_dispatch:

permissions:
  contents: read

# Never cancel: a half-run release job is worse than a redundant one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The version comes from the Makefiles, which name the packages; a tag has to agree with them.
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      build: ${{ steps.decide.outputs.build }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide what this run is
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu

          MKS="qwdtt-client/Makefile luci-proto-qwdtt/Makefile"
          cur=""
          for mk in $MKS; do
            v=$(sed -n 's/^PKG_VERSION:=[[:space:]]*//p' "$mk" | tr -d '[:space:]')
            [ -n "$cur" ] || cur=$v
            if [ "$v" != "$cur" ]; then
              echo "$mk is $v, but the first Makefile says $cur"
              exit 1
            fi
          done

          case "$GITHUB_EVENT_NAME:${GITHUB_REF:-}" in
          workflow_dispatch:*)
            # Dispatch: rebuild and republish the feed, release nothing.
            tag=v$cur
            build=true; release=false ;;
          *:refs/tags/v*)
            tag=$GITHUB_REF_NAME
            if [ "${tag#v}" != "$cur" ]; then
              echo "tag $tag does not match PKG_VERSION $cur"
              exit 1
            fi
            build=true; release=true ;;
          *:refs/heads/main)
            # Release when the tree's version has no tag yet: the state a merged bump leaves.
            tag=v$cur
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists; nothing to release"
              build=false; release=false
            else
              build=true; release=true
            fi ;;
          *)
            echo "unexpected event $GITHUB_EVENT_NAME on ${GITHUB_REF:-}"
            exit 1 ;;
          esac

          echo "version=$cur tag=$tag build=$build release=$release"
          {
            echo "tag=$tag"
            echo "build=$build"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build
    needs: version
    if: needs.version.outputs.build == 'true'
    uses: ./.github/workflows/build.yml
    # Everything, not what the diff suggests: this run publishes the result.
    with:
      full: true
    permissions:
      contents: read
    secrets: inherit

  # Signing the index is what makes the packages trusted: apk verifies the index, then each
  # package by its hash. OpenWrt cannot sign the .apk files themselves.
  feed:
    name: publish feed
    needs: [version, build]
    # vars.PUBLISH: forks have no signing keys or Pages, and the sandbox can rehearse unpatched.
    # Only main or a tag: a dispatch on a branch would deploy unmerged packages over the live feed.
    if: >-
      vars.PUBLISH == 'true' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The two formats land in separate directories because both artifacts
      # carry an x86_64/qwdtt/ and would otherwise overwrite each other.
      - name: Download the apk packages
        uses: actions/download-artifact@v8
        with:
          name: packages-${{ needs.build.outputs.apk_sdk }}
          path: staged-apk

      - name: Download the ipk packages
        uses: actions/download-artifact@v8
        with:
          name: packages-${{ needs.build.outputs.ipk_sdk }}
          path: staged-ipk

      # The clients share one directory: .ipk and .apk differ by extension.
      - name: Download the client packages
        uses: actions/download-artifact@v8
        with:
          pattern: client-package-*
          merge-multiple: true
          path: staged

      # One directory per OpenWrt release (24.10 opkg, 25.12 apk); each architecture gets its
      # client plus the noarch packages.
      - name: Assemble the feed
        run: |
          mkdir -p noarch-apk noarch-ipk
          cp staged-apk/x86_64/qwdtt/luci-*.apk noarch-apk/
          cp staged-ipk/x86_64/qwdtt/luci-*.ipk noarch-ipk/

          for d in staged/*/qwdtt; do
            arch=$(basename "$(dirname "$d")")

            if ls "$d"/qwdtt-client-*.apk >/dev/null 2>&1; then
              mkdir -p "site/releases/25.12/$arch"
              cp "$d"/qwdtt-client-*.apk noarch-apk/*.apk "site/releases/25.12/$arch/"
            fi

            if ls "$d"/qwdtt-client_*.ipk >/dev/null 2>&1; then
              mkdir -p "site/releases/24.10/$arch"
              cp "$d"/qwdtt-client_*.ipk noarch-ipk/*.ipk "site/releases/24.10/$arch/"
            fi
          done
          find site -type f \( -name '*.apk' -o -name '*.ipk' \) | sort

      - name: Sign the index
        env:
          APK_PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
        run: |
          test -n "$APK_PRIVATE_KEY" || {
            echo "APK_PRIVATE_KEY is not set; the feed would be unusable"
            exit 1
          }

          # The key goes in by environment and is written inside the container. Root, because the bind
          # mount is the runner's uid. The umask covers the whole block, unlike the opkg step: safe only
          # because of the chown below, so do not make the two agree.
          docker run --rm --user 0:0 -e APK_PRIVATE_KEY \
            -v "$PWD:/w" -w /w ghcr.io/openwrt/sdk:${{ needs.build.outputs.apk_sdk }} \
            sh -c 'umask 077
                   printf "%s\n" "$APK_PRIVATE_KEY" > /tmp/key.pem
                   for d in /w/site/releases/25.12/*; do
                     ( cd "$d" && /builder/staging_dir/host/bin/apk mkndx \
                         --allow-untrusted \
                         --sign /tmp/key.pem \
                         --output packages.adb *.apk ) || exit 1
                   done'

          sudo chown -R "$(id -u):$(id -g)" site
          find site -name packages.adb -exec ls -l {} \;

      - name: Sign the opkg index
        env:
          IPK_PRIVATE_KEY: ${{ secrets.IPK_PRIVATE_KEY }}
        run: |
          test -n "$IPK_PRIVATE_KEY" || {
            echo "IPK_PRIVATE_KEY is not set; the 24.10 feed would be unusable"
            exit 1
          }

          docker run --rm --user 0:0 -e IPK_PRIVATE_KEY \
            -v "$PWD:/w" -w /w "ghcr.io/openwrt/sdk:${{ needs.build.outputs.ipk_sdk }}" \
            sh -c 'set -e
                   # The umask covers the key only: on Packages it would stop the verify step reading it.
                   ( umask 077; printf "%s\n" "$IPK_PRIVATE_KEY" > /tmp/key-build )
                   # ipkg-make-index.sh hashes through $MKHASH, which the build
                   # normally exports; unset it silently becomes `sha256`.
                   export MKHASH=/builder/staging_dir/host/bin/mkhash
                   for d in /w/site/releases/24.10/*; do
                     ( cd "$d" && /builder/scripts/ipkg-make-index.sh . > Packages &&
                       gzip -9nc Packages > Packages.gz &&
                       /builder/staging_dir/host/bin/usign \
                         -S -m Packages -s /tmp/key-build -x Packages.sig ) || exit 1
                   done'

          sudo chown -R "$(id -u):$(id -g)" site
          find site -name 'Packages*' -exec ls -l {} \;

      # If this passes, a router trusting this key installs without --allow-untrusted.
      - name: Verify the index against the published public key
        run: |
          cp keys/qwdtt.pem site/qwdtt.pem
          cp keys/qwdtt-usign.pub site/qwdtt-usign.pub
          docker run --rm -v "$PWD:/w" -w /w ghcr.io/openwrt/sdk:${{ needs.build.outputs.apk_sdk }} \
            sh -c 'mkdir -p /tmp/k && cp /w/keys/qwdtt.pem /tmp/k/
                   for i in /w/site/releases/25.12/*/packages.adb; do
                     printf "%s: " "$i"
                     /builder/staging_dir/host/bin/apk verify --keys-dir /tmp/k "$i" || exit 1
                   done'

          docker run --rm -v "$PWD:/w" -w /w \
            "ghcr.io/openwrt/sdk:${{ needs.build.outputs.ipk_sdk }}" \
            sh -c 'u=/builder/staging_dir/host/bin/usign
                   echo "usign key id: $($u -F -p /w/keys/qwdtt-usign.pub)"
                   for i in /w/site/releases/24.10/*/Packages; do
                     printf "%s: " "$i"
                     $u -V -m "$i" -p /w/keys/qwdtt-usign.pub -x "$i.sig" &&
                       echo OK || exit 1
                   done'

      - name: Generate the site
        run: |
          .github/scripts/generate-feed-pages.sh site \
            "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"

      # The theme only exists in the github-pages gem set, so the site has to
      # be built here; upload-pages-artifact serves the directory as-is.
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: site
          destination: _site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v5

  # After the feed: --target creates the tag, so a release beside a failed feed would spend it.
  release:
    name: Publish release
    needs: [version, build, feed]
    # A dispatch republishes the feed and releases nothing, so this is the one
    # place that asks whether a release is actually being made.
    if: >-
      vars.PUBLISH == 'true' &&
      needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # For keys/: a job that only downloads artifacts starts with an empty workspace.
      - name: Check out
        uses: actions/checkout@v7

      - name: Download every artifact
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist

      # apk names carry no architecture, so two clients would collide as release assets;
      # fold the arch in from the path.
      - name: Name the client packages after their architecture
        run: |
          for f in dist/*/qwdtt/qwdtt-client-*.apk; do
            [ -e "$f" ] || continue
            arch=$(basename "$(dirname "$(dirname "$f")")")
            mv "$f" "dist/$(basename "$f" .apk)-$arch.apk"
          done

      # Shaped as a backup archive: restoring it under System -> Backup is the only way
      # to place a key without shell access.
      - name: Build the key archives
        run: |
          mkdir -p apkroot/etc/apk/keys
          cp keys/qwdtt.pem apkroot/etc/apk/keys/qwdtt.pem
          # Owned by root: a restore unpacks these over /etc and keeps the owner.
          tar --owner=0 --group=0 --numeric-owner -C apkroot -czf dist/qwdtt-apk-key.tar.gz etc
          tar -tzvf dist/qwdtt-apk-key.tar.gz

          # opkg finds a key by its id: a usign public key is a 2-byte tag, then the 8-byte id.
          keyid=$(sed -n '2p' keys/qwdtt-usign.pub | base64 -d |
                  od -An -tx1 -j2 -N8 | tr -d ' \n')
          echo "usign key id: $keyid"
          mkdir -p opkgroot/etc/opkg/keys
          cp keys/qwdtt-usign.pub "opkgroot/etc/opkg/keys/$keyid"
          tar --owner=0 --group=0 --numeric-owner -C opkgroot -czf dist/qwdtt-opkg-key.tar.gz etc
          tar -tzvf dist/qwdtt-opkg-key.tar.gz

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          assets=$(find dist -type f \
            \( -name '*-key.tar.gz' -o -name '*.ipk' -o -name '*.apk' \) | sort)
          echo "$assets"

          # Fail loudly rather than let the upload silently drop one of a pair:
          # assets are keyed by basename, so two files sharing one cannot both
          # be published.
          dupes=$(echo "$assets" | xargs -n1 basename | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "duplicate asset names:"
            echo "$dupes"
            exit 1
          fi

          # A re-run arrives with the release already published; upload over it so a re-run works.
          if gh release view "${TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release exists; replacing its assets"
            gh release upload "${TAG}" $assets \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            # --target creates the tag here when it does not exist yet, which is the merge path.
            gh release create "${TAG}" $assets \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "qWDTT OpenWrt ${TAG}" \
              --notes "Indexing assets..."
          fi

      # From the names GitHub stored: it rewrites characters, so luci-i18n's ~ becomes ".".
      - name: Compose the download table
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          noarch="luci-proto-qwdtt luci-i18n-qwdtt-ru"
          names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                    --json assets -q '.assets[].name')

          # Targets come from the client .ipk names rather than a list: an unknown arch would
          # otherwise be sorted as noarch.
          arches=$(echo "$names" |
                   sed -n 's/^qwdtt-client_[^_]*_\(.*\)\.ipk$/\1/p' | sort -u)
          test -n "$arches" || { echo "no client packages found in the release"; exit 1; }
          echo "targets: $(echo $arches | tr '\n' ' ')"

          link() {  # ext target -> <a> for its file, or N/A
            for f in $(echo "$names" | grep "\.$1$" | sort); do
              a=All
              for k in $arches; do case "$f" in *"$k"*) a=$k ;; esac; done
              [ "$a" = "$2" ] && { printf '<a href="%s/%s">%s</a>' "$base" "$f" "$f"; return; }
            done
            printf 'N/A'
          }
          noarch_link() {  # pkg ext -> <a> for the noarch build of pkg, or N/A
            for f in $(echo "$names" | grep -E "^$1[_-].*\.$2$" | sort); do
              # a noarch name may also prefix a per-arch build's name; drop those
              for k in $arches; do case "$f" in *"$k"*) continue 2 ;; esac; done
              printf '<a href="%s/%s">%s</a>' "$base" "$f" "$f"; return
            done
            printf 'N/A'
          }

          # GitHub's own notes pick the previous release; only their changelog line is kept.
          changelog=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
                        -f tag_name="$TAG" --jq .body | grep '^\*\*Full Changelog\*\*' || true)

          {
            [ -z "$changelog" ] || printf '%s\n\n' "$changelog"
            echo "### Packages"
            echo
            echo "Install \`qwdtt-client\` package for your target and packages from the last **All** row."
            echo
            echo "<table>"
            echo "<tr><th>Target</th><th>IPK</th><th>APK (OpenWrt 25.12+)</th></tr>"
            for k in $(printf '%s\n' $arches | sort); do
              echo "<tr><td>$k</td><td>$(link ipk "$k")</td><td>$(link apk "$k")</td></tr>"
            done
            n=$(set -- $noarch; echo $#)
            first=1
            for pkg in $noarch; do
              if [ "$first" = 1 ]; then
                echo "<tr><td rowspan=\"$n\">All</td><td>$(noarch_link "$pkg" ipk)</td><td>$(noarch_link "$pkg" apk)</td></tr>"
                first=0
              else
                echo "<tr><td>$(noarch_link "$pkg" ipk)</td><td>$(noarch_link "$pkg" apk)</td></tr>"
              fi
            done
            echo "</table>"
          } > body.md
          cat body.md

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --notes-file body.md
