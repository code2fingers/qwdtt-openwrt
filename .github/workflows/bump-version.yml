# Bumps PKG_VERSION in both packages and opens the release PR; merging it is the release.
# Needs "Allow GitHub Actions to create and approve pull requests" on the repository.
---
name: Bump version

on:
  workflow_dispatch:
    inputs:
      part:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: bump and open the release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # Tags are needed to refuse a version that was already released.
          fetch-depth: 0

      - name: Bump and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PART: ${{ inputs.part }}
        run: |
          set -eu

          # Running this from a feature branch would put that branch's other
          # commits into the release pull request.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "run this on main; it is at $GITHUB_REF"
            exit 1
          fi

          MKS="qwdtt-client/Makefile luci-proto-qwdtt/Makefile"

          # The two Makefiles must already agree; a bump would carry a disagreement forward.
          cur=""
          for mk in $MKS; do
            v=$(sed -n 's/^PKG_VERSION:=[[:space:]]*//p' "$mk" | tr -d '[:space:]')
            [ -n "$cur" ] || cur=$v
            if [ "$v" != "$cur" ]; then
              echo "$mk is $v, but the first Makefile says $cur"
              exit 1
            fi
          done

          # Exactly x.y.z: anything else breaks the arithmetic below.
          bad=0
          case "$cur" in
          "" | *[!0-9.]* | *..* | .* | *.) bad=1 ;;
          esac
          [ "$(printf '%s' "$cur" | tr -cd . | wc -c)" -eq 2 ] || bad=1
          if [ "$bad" -ne 0 ]; then
            echo "PKG_VERSION is '$cur', which is not x.y.z"
            exit 1
          fi

          rest=${cur#*.}
          major=${cur%%.*}
          minor=${rest%%.*}
          patch=${rest#*.}

          case "$PART" in
          major) major=$((major + 1)); minor=0; patch=0 ;;
          minor) minor=$((minor + 1)); patch=0 ;;
          patch) patch=$((patch + 1)) ;;
          esac
          new="$major.$minor.$patch"
          echo "$cur -> $new"

          if git rev-parse -q --verify "refs/tags/v$new" >/dev/null; then
            echo "v$new is already tagged"
            exit 1
          fi

          for mk in $MKS; do
            sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$new/" "$mk"
            # PKG_RELEASE counts packaging revisions within one version, so a
            # new version starts it over.
            sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=1/" "$mk"
          done
          grep -H '^PKG_VERSION\|^PKG_RELEASE' $MKS

          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git checkout -q -b "release/v$new"
          git commit -qam "release: $new"
          git push -q origin "release/v$new"

          body=$(cat <<EOF
          Bumps \`PKG_VERSION\` to \`$new\` and resets \`PKG_RELEASE\` to \`1\` in:

          - \`qwdtt-client\`
          - \`luci-proto-qwdtt\`

          Merging this PR will publish version: \`$new\`

          The release workflow runs automatically on merge and will create the corresponding tag: \`v$new\`
          EOF
          )

          gh pr create --base main --head "release/v$new" \
            --title "release: $new" \
            --body "$body"
